schema: spec-driven

context: |
  Product: An Ireland-wide table-tennis app linked to independently hosted club websites,
  launching initially with Leeside Table Tennis in Cork as the only participating club.
  Product direction: Prove the product with one club, while preserving a path to offer it
  to table-tennis clubs across Ireland as a shared platform for players and clubs.
  Stage: Operational source implementation and local verification. TypeScript/React/Vite,
  Supabase Auth/functions/PostgreSQL and Cloudflare static hosting are selected for the pilot.
  Hosted Supabase setup is paused: the office laptop blocks connections; the owner will
  complete account-required setup from a personal laptop. Both public frontends and the public
  reader were observed live on 12 November; private/provider acceptance remains unverified.
  Resume through docs/START_HERE.md and record non-secret outcomes in docs/DEPLOYMENT_STATUS.md.
  See the active change runtime-design.md and
  docs/PERSONAL_LAPTOP_LAUNCH.md; no extra coding-agent subscription is required for setup.
  Verification: npm run verify:local runs unit/setup/HTTP and automatic website/app browser checks;
  PostgreSQL integration and migration/bootstrap reruns run in CI without personal-laptop Docker.
  The platform repository owns the app and shared backend, not a generic website hosting service.
  Pilot exception: retain apps/club-web and the app in this repository for at least one year
  of live operation. Review website separation only after that period and once more than
  two clubs participate; no immediate extraction or build-target removal is planned.
  Club websites may have independent repositories and hosting and link into the app for sign-in
  and operations. Optional public feeds expose only deliberately published app records.
  The app must not be branded as belonging only to Leeside because it is intended for
  future adoption by table-tennis clubs across Ireland.
  Users include visitors, adult players, parents/guardians, coaches, and club committee/admin staff.
  Requirements must distinguish the public experience, member experience, coach experience,
  parent/guardian experience, and club administration.
  The first release must work without paid third-party integrations or an online payment gateway.
  Current club context: Five weekly sessions and flexible full, partial, and pay-as-you-go
  membership are advertised on the club's temporary Wix website.
  Consider Irish/EU privacy obligations and accessibility from the outset.

rules:
  proposal:
    - Keep the proposal concise and separate confirmed scope from assumptions.
    - Include explicit non-goals and unresolved product decisions.
  specs:
    - Write testable requirements and scenarios in plain language.
    - Cover permissions, privacy, accessibility, and failure states where relevant.
  tasks:
    - Break implementation work into independently verifiable tasks.
