name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  venue-qr-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: tti_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-test-only
      PGDATABASE: tti_test
      TTI_TEST_DATABASE_URL: postgres://postgres:ci-test-only@127.0.0.1:5432/tti_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: node scripts/prepare-functions.mjs
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/plain_postgres_auth_fixture.sql
      - run: node scripts/prepare-migrations.mjs
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations.local.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations.local.sql
      - run: node --experimental-strip-types scripts/prepare-club.mjs --owner 11111111-1111-4111-8111-111111111111 --email ci-owner@example.invalid
      - run: psql -v ON_ERROR_STOP=1 -f supabase/bootstrap.local.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/bootstrap.local.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/venue_qr.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/runtime.sql
      - run: deno test --config supabase/functions/deno.json --allow-env --allow-net supabase/functions/database.integration.test.ts
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/prepare-functions.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/deno.json supabase/functions/club-api/index.ts supabase/functions/club-jobs/index.ts
      - run: deno check --config supabase/functions/deno.json supabase/functions/club-public/index.ts
      - run: deno test --config supabase/functions/deno.json --allow-env --allow-net supabase/functions/runtime.integration.test.ts
      - run: deno test --config supabase/functions/deno.json --allow-env --allow-net supabase/functions/jobs.integration.test.ts supabase/functions/public.integration.test.ts
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
  browser-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser:local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-browser-screenshots
          path: test-results/
          retention-days: 7
