name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  venue-qr-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-test-only
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/plain_postgres_auth_fixture.sql
      - run: |
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration" || exit 1
          done
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/venue_qr.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/runtime.sql
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/prepare-functions.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/deno.json supabase/functions/club-api/index.ts supabase/functions/club-jobs/index.ts
      - run: deno check --config supabase/functions/deno.json supabase/functions/club-public/index.ts
      - run: deno test --config supabase/functions/deno.json --allow-env --allow-net supabase/functions/runtime.integration.test.ts
      - run: deno test --config supabase/functions/deno.json --allow-env --allow-net supabase/functions/jobs.integration.test.ts supabase/functions/public.integration.test.ts
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
